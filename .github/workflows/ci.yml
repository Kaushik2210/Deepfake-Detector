name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ts:
    name: Typecheck, lint, test (TypeScript workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Test
        run: pnpm turbo run test

      - name: Build
        # Catches errors that only surface during the production build, such as
        # server/client component boundary violations.
        run: pnpm turbo run build

  python:
    name: Lint and test (inference service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install service
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        # Model-marked tests download ~340 MB of weights, so they are excluded here
        # and run locally. Everything else is offline and needs no network.
        run: pytest -m "not model" -q
