[project]
name = "veriframe-inference"
version = "0.1.0"
description = "VeriFrame inference service — image detection pipeline (Stream A: spatial)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "numpy>=1.26,<3",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "mediapipe>=0.10",
    "psycopg[binary]>=3.2",
    "pillow>=11",
    "torch>=2.5",
    "transformers>=4.47",
    "grad-cam>=1.5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    # torch>=2.6 routes torch.onnx.export through the dynamo exporter, which needs this.
    "onnxscript>=0.1",
    "httpx>=0.28",
    # Stream D: Content Credentials verification.
    "c2pa-python>=0.30",
    # Audio decode (wav/flac/ogg) for the audio anti-spoofing pipeline.
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]
# Evaluation harness only. Not needed to serve inference, and kept separate so a
# deployment does not pull in the dataset tooling.
eval = [
    "scikit-learn>=1.5",
    "huggingface-hub>=0.26",
    # Audio eval datasets are published as proper HF `datasets` repos, unlike the
    # image corpora's raw ZIPs, so the audio harness streams them through this
    # instead of reimplementing zip-over-HTTP. The Audio column is read
    # undecoded (Audio(decode=False)) and decoded via this project's own
    # soundfile-based audio_io.decode_audio -- NOT via `datasets`'s default
    # decoder, which requires torchcodec, which itself requires a system FFmpeg
    # install this project deliberately avoids. See audio_datasets.py.
    "datasets>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: requires downloading real model weights from Hugging Face (deselect with '-m \"not model\"')",
    "db: requires a reachable Postgres at settings.database_url",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults. That is exactly how FastAPI
# declares dependencies and file params, so it is a false positive on route handlers.
extend-ignore = ["B008"]
